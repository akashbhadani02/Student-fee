<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeakPro • Fee & Branch Management</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#718096;--line:#e7ebf2;--brand:#315efb;--brand2:#6c63ff;--green:#16a36a;--orange:#e99a1c;--red:#df4b55;--nav:#111a33;--shadow:0 12px 32px rgba(23,32,51,.08);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,#dfe7ff 0,#f4f7fb 42%,#eef2f7 100%)}
.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 70px rgba(31,47,80,.14);padding:34px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.logo h1{font-size:20px;margin:0}.logo span{font-size:12px;color:var(--muted)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:#f2f5fa;border-radius:12px;padding:4px;margin-bottom:20px}.mode button{border:0;background:transparent;padding:10px;border-radius:9px;color:var(--muted);font-weight:700}.mode button.active{background:#fff;color:var(--brand);box-shadow:0 3px 10px rgba(20,30,60,.08)}
.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;color:#596579;margin-bottom:7px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #dfe5ee;border-radius:11px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(49,94,251,.1)}
.primary{width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:13px;font-weight:800;margin-top:8px}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:var(--nav);color:#fff;padding:22px 16px;display:flex;flex-direction:column}.brand{padding:8px 10px 24px;display:flex;gap:11px;align-items:center}.brand .logo-mark{width:40px;height:40px}.brand strong{display:block;font-size:15px}.brand small{color:#9ba7c4;font-size:11px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#b7c0d5;text-align:left;padding:12px 13px;border-radius:11px;font-weight:700}.nav button.active,.nav button:hover{background:#1d294a;color:#fff}.sidebar-bottom{margin-top:auto;border-top:1px solid #283352;padding-top:14px}.user-mini{padding:10px 12px;color:#b7c0d5;font-size:12px}.logout{width:100%;border:1px solid #33405f;background:#192441;color:#fff;border-radius:10px;padding:10px;font-weight:700}
.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.topbar h2{font-size:18px;margin:0}.topbar p{margin:3px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:9px}.pill{background:#eef3ff;color:var(--brand);font-weight:800;border-radius:99px;padding:8px 11px;font-size:12px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px}.content{padding:26px;max-width:1600px;margin:auto}.page{display:none}.page.active{display:block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted);font-weight:800}.stat .value{font-size:27px;font-weight:900;margin-top:8px}.stat .sub{font-size:11px;color:var(--muted);margin-top:5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h3{margin:0;font-size:15px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:150px;outline:none}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;color:#344056}.btn.primary-btn{background:var(--brand);border-color:var(--brand);color:#fff}.btn.green{background:#eaf9f2;border-color:#c9efdc;color:#117b50}.btn.danger{background:#fff0f1;border-color:#ffd1d5;color:#b82e38}.btn:disabled{opacity:.5;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1.35fr .9fr;gap:16px;margin-top:16px}.branch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.branch-card{padding:18px}.branch-card .top{display:flex;justify-content:space-between;align-items:center}.branch-name{font-weight:900}.branch-code{font-size:11px;color:var(--muted);margin-top:3px}.branch-num{font-size:30px;font-weight:900;margin-top:18px}.progress{height:8px;background:#edf0f5;border-radius:20px;overflow:hidden;margin:11px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:20px}.branch-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.branch-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px}.branch-summary-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff;box-shadow:0 3px 12px rgba(23,32,51,.05);min-width:0}.branch-summary-card.active{border-color:#c9d4fb;background:#f8faff}.branch-summary-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.branch-summary-title{font-size:15px;font-weight:900}.branch-summary-code{font-size:10px;color:var(--muted);margin-top:3px}.branch-summary-students{font-size:11px;color:var(--muted);white-space:nowrap}.branch-summary-main{font-size:24px;font-weight:900;margin-top:14px}.branch-summary-main small{font-size:10px;font-weight:700;color:var(--muted)}.branch-summary-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.branch-summary-metric{background:#f7f9fc;border-radius:10px;padding:9px}.branch-summary-metric span{display:block;font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase}.branch-summary-metric b{display:block;font-size:12px;margin-top:3px}.branch-summary-balance{margin-top:10px;padding:9px 10px;border-radius:10px;background:#eef3ff;color:#2349c5;font-size:11px;display:flex;justify-content:space-between;gap:8px}.branch-summary-empty{padding:28px;text-align:center;color:var(--muted)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#7a8496;background:#fafbfc;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}.table td{padding:13px 14px;border-bottom:1px solid #eef1f5;font-size:13px}.table tr:hover td{background:#fbfcff}.namecell{font-weight:800}.muted{color:var(--muted);font-size:11px}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:900}.badge.blue{background:#edf2ff;color:#315efb}.badge.green{background:#eaf9f2;color:#118254}.badge.orange{background:#fff5df;color:#9a6500}.badge.red{background:#fff0f1;color:#b52c37}
.empty{padding:50px;text-align:center;color:var(--muted)}.branch-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:15px}.branch-tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;font-weight:800;color:#536077;cursor:pointer;box-shadow:0 2px 8px rgba(25,35,55,.04);transition:.15s;min-height:92px}.branch-tab:hover{border-color:#cfd9f5;transform:translateY(-1px)}.branch-tab.active{background:#eef3ff;color:var(--brand);border-color:#bfcdf7;box-shadow:0 5px 16px rgba(49,94,251,.10)}.branch-tab .branch-card-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.branch-tab .branch-card-name{font-size:14px;font-weight:900}.branch-tab .branch-card-count{font-size:22px;font-weight:900;color:#172033;margin-top:10px}.branch-tab .branch-card-meta{font-size:10px;color:var(--muted);margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(15,22,40,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modal-card{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.modal-body{padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:var(--shadow);z-index:100;font-size:12px}.mobile-menu{display:none}
@media(max-width:1000px){.app{grid-template-columns:82px 1fr}.sidebar{padding:18px 10px}.brand{justify-content:flex-start}.nav button{text-align:left}.user-mini{display:block}.logout span{display:inline}.nav button span{display:inline}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.branch-grid{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.app{display:block}.sidebar{position:fixed;left:-280px;width:250px;z-index:60;transition:.2s}.sidebar.open{left:0}.mobile-menu{display:block}.content{padding:16px}.topbar{padding:0 16px}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px}.stat .value{font-size:21px}.branch-grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top-actions .pill{display:none}}


/* Mobile drawer: keep navigation labels visible */
@media(max-width:680px){
  .branch-summary-grid{grid-template-columns:1fr;gap:10px;padding:10px}
  .branch-summary-card{padding:14px}
  .sidebar .brand div:not(.logo-mark),
  .sidebar .nav button span,
  .sidebar .user-mini,
  .sidebar .logout span{display:block}
  .sidebar .brand{justify-content:flex-start}
  .sidebar .nav button{text-align:left;display:flex;align-items:center;gap:10px}
  .sidebar .logout{display:flex;align-items:center;justify-content:flex-start;gap:10px}
}

/* Enhanced mobile responsive layout */
.app{position:relative}
@media(max-width:680px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  .app{min-height:100dvh}
  .app.menu-open::before{
    content:"";position:fixed;inset:0;background:rgba(15,22,40,.42);
    z-index:55;backdrop-filter:blur(1px)
  }
  .sidebar{top:0;bottom:0;height:100dvh;max-height:100dvh;overflow-y:auto;padding:18px 14px}
  .sidebar.open{left:0;box-shadow:12px 0 35px rgba(0,0,0,.18)}
  .topbar{height:auto;min-height:64px;padding:10px 12px;gap:8px}
  .topbar>div:first-child{min-width:0;display:flex;align-items:center;flex:1}
  .topbar h2{font-size:16px;line-height:1.2}
  .topbar p{font-size:10px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
  .top-actions{flex-shrink:0}
  .iconbtn{min-width:42px;min-height:42px;padding:9px}
  .mobile-menu{margin:0 2px 0 0}
  .content{padding:12px;max-width:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:13px;min-width:0}
  .stat .label{font-size:10px}
  .stat .value{font-size:20px;line-height:1.15;word-break:break-word}
  .stat .sub{font-size:10px}
  .grid2{grid-template-columns:1fr;gap:12px;margin-top:12px}
  .branch-grid{grid-template-columns:1fr;gap:12px}
  .panel{border-radius:14px}
  .panel-head{padding:14px;align-items:flex-start;flex-direction:column}
  .panel-head .toolbar,.panel-head>div.toolbar{width:100%}
  .toolbar{width:100%;display:grid;grid-template-columns:1fr;gap:8px}
  .toolbar input,.toolbar select,.toolbar .btn,.toolbar button{width:100%;min-width:0;min-height:42px}
  .branch-tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-bottom:2px}
  .branch-tab{min-height:86px;padding:12px}
  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .table{min-width:680px}
  .table th,.table td{padding:11px 10px;white-space:nowrap}
  .actions{flex-direction:column;align-items:stretch}
  .actions .btn{width:100%;min-height:44px}
  .formgrid{grid-template-columns:1fr;gap:8px}
  .field{margin:10px 0}
  .modal{padding:8px;align-items:flex-end}
  .modal-card{width:100%;max-height:92dvh;border-radius:18px 18px 10px 10px}
  .modal-head{padding:14px 16px}
  .modal-body{padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  .login{padding:14px}
  .login-card{padding:22px 18px;border-radius:20px}
  .mode button,.primary{min-height:44px}
  .field input,.field select{min-height:44px}
}
@media(min-width:681px) and (max-width:1000px){
  .table-wrap{overflow-x:auto}
}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo"><div class="logo-mark">S</div><div><h1>SpeakPro Manager</h1><span>Spoken English • Fee & Branch Control</span></div></div>
    <div class="mode"><button id="mainMode" class="active" onclick="setLoginMode('main')">Main Admin</button><button id="branchMode" onclick="setLoginMode('branch')">Branch Login</button></div>
    <div id="mainLogin">
      <div class="field"><label>Admin Password</label><input id="adminPassword" type="password" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')loginMain()"></div>
      <button class="primary" onclick="loginMain()">Open Dashboard</button>
      <div class="hint">Main admin can view all branches, all students, collections and reports.</div>
    </div>
    <div id="branchLogin" class="hidden">
      <div class="field"><label>Branch Username</label><input id="branchUsername" placeholder="e.g. velanj_admin"></div>
      <div class="field"><label>Password</label><input id="branchPassword" type="password" placeholder="Branch password" onkeydown="if(event.key==='Enter')loginBranch()"></div>
      <button class="primary" onclick="loginBranch()">Login to Branch</button>
      <div class="hint">Branch users only see their own students and collection records.</div>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="logo-mark">S</div><div><strong>SpeakPro</strong><small>Management Suite</small></div></div>
    <nav class="nav">
      <button class="active" data-page="dashboard" onclick="go('dashboard')">◉ <span>Dashboard</span></button>
      <button data-page="students" onclick="go('students')">▣ <span>Students</span></button>
      <button data-page="collections" onclick="go('collections')">₹ <span>Collections</span></button>
      <button data-page="branches" onclick="go('branches')">⌂ <span>Branches</span></button>
      <button data-page="reports" onclick="go('reports')">▤ <span>Reports</span></button>
    </nav>
    <div class="sidebar-bottom"><div id="userMini" class="user-mini"></div><button class="logout" onclick="logout()">↪ <span>Logout</span></button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><button class="iconbtn mobile-menu" onclick="toggleSidebar()">☰</button><span id="pageTitle" style="margin-left:8px"><h2>Dashboard</h2><p id="pageSub">Overview of students, fees and commission</p></span></div><div class="top-actions"><span id="accessPill" class="pill">Main Admin</span><button class="iconbtn" onclick="refreshData()">↻</button></div></header>
    <section class="content">
      <div id="dashboard" class="page active"></div>
      <div id="students" class="page"></div>
      <div id="collections" class="page"></div>
      <div id="branches" class="page"></div>
      <div id="reports" class="page"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button class="iconbtn" onclick="closeModal()">✕</button></div><div id="modalBody" class="modal-body"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const state={students:[],deletedStudents:[],history:[],payouts:[],branches:[],branchUsers:[],access:null,adminPassword:'',adminGrant:null,page:'dashboard',studentBranch:'ALL'};
const pageMeta={dashboard:['Dashboard','Overview of students, fees and commission'],students:['Students','Manage all students branch-wise'],collections:['Collections','Track money taken from each branch'],branches:['Branches','Branch performance and access'],reports:['Reports','Quick summaries and Excel export']};
let loginMode='main';

function setLoginMode(m){loginMode=m;mainMode.classList.toggle('active',m==='main');branchMode.classList.toggle('active',m==='branch');mainLogin.classList.toggle('hidden',m!=='main');branchLogin.classList.toggle('hidden',m!=='branch')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.add('hidden'),2600)}
async function api(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function loginMain(){const p=adminPassword.value.trim();if(!p)return toast('Enter admin password.');try{await api('/api/auth',{method:'POST',body:JSON.stringify({action:'verify',key:'pageOpen',password:p})});state.adminPassword=p;localStorage.removeItem('branchToken');state.access={type:'main'};await refreshData();showApp();startLiveSync();}catch(e){toast(e.message)}}
async function loginBranch(){const username=branchUsername.value.trim(),password=branchPassword.value;if(!username||!password)return toast('Enter username and password.');try{const d=await api('/api/auth',{method:'POST',body:JSON.stringify({action:'branchLogin',username,password})});localStorage.setItem('branchToken',d.token);state.adminPassword='';state.access=d.user;await refreshData();showApp();startLiveSync();}catch(e){toast(e.message)}}
function showApp(){login.classList.add('hidden');app.classList.remove('hidden');const isMain=state.access.type==='main';document.getElementById('accessPill').textContent=isMain?'Main Admin':state.access.branch;document.getElementById('userMini').innerHTML='<b>'+esc(isMain?'Main Admin':state.access.username)+'</b><br>'+esc(isMain?'All branches':state.access.branch);document.querySelector('[data-page=branches]').classList.toggle('hidden',!isMain);document.querySelector('[data-page=reports]').classList.toggle('hidden',!isMain);if(!isMain&&['branches','reports'].includes(state.page))state.page='dashboard';renderAll()}
function logout(){localStorage.removeItem('branchToken');state.access=null;state.students=[];state.deletedStudents=[];state.history=[];state.branches=[];state.branchUsers=[];state.adminGrant=null;app.classList.add('hidden');login.classList.remove('hidden');adminPassword.value='';branchPassword.value='';}
function authHeaders(action='pageOpen',grantPassword=''){const h={'X-Admin-Action':action};const t=localStorage.getItem('branchToken');if(t){h.Authorization='Bearer '+t;if(grantPassword)h['X-Admin-Password']=grantPassword;}else{h['X-Main-Admin']='true';h['X-Admin-Password']=state.adminPassword}return h}
async function requestAdminEdit(action){if(state.access?.type!=='branch')return '';const p=prompt('Main admin password required to '+action+'. Enter admin password:');if(!p)return null;try{await api('/api/auth',{method:'POST',body:JSON.stringify({action:'verify',key:action,password:p})});state.adminGrant={password:p,action,expires:Date.now()+10*60*1000};toast('Admin approval granted for this edit session.');return p}catch(e){toast('Wrong admin password.');return null}}
function currentGrant(action=''){return state.access?.type==='branch'&&state.adminGrant&&Date.now()<state.adminGrant.expires&&(!action||state.adminGrant.action===action)?state.adminGrant.password:''}
async function refreshData(showToast=true){try{const d=await api('/api/state',{headers:authHeaders('pageOpen')});state.students=d.students||[];state.deletedStudents=d.deletedStudents||[];state.history=d.history||[];state.payouts=d.payouts||[];state.revision=d.revision||'';if(d.access)state.access=d.access;if(state.access?.type==='main' && showToast)await refreshBranchCredentials();renderAll();if(showToast)toast('Data refreshed')}catch(e){if(/login|unauthorized|wrong password/i.test(e.message))logout();else if(showToast)toast(e.message)}}
let liveSyncTimer=null,liveSyncBusy=false;
async function checkLiveSync(){if(!state.access||liveSyncBusy||document.getElementById('modal')?.classList.contains('show'))return;liveSyncBusy=true;try{const d=await api('/api/state?sync=1',{headers:authHeaders('pageOpen')});if(d.revision&&d.revision!==state.revision){await refreshData(false)}}catch(e){}finally{liveSyncBusy=false}}
function startLiveSync(){clearInterval(liveSyncTimer);liveSyncTimer=setInterval(checkLiveSync,2000)}
async function saveData(action,students=state.students,history=state.history,grantPassword=''){try{const pass=grantPassword||currentGrant();const d=await api('/api/state',{method:'PUT',headers:authHeaders(action,pass),body:JSON.stringify({students,history,payouts:state.payouts})});state.students=d.students||students;state.history=d.history||history;renderAll();toast('Saved successfully');}catch(e){toast(e.message);throw e}}
async function refreshBranchCredentials(){if(state.access?.type!=='main')return;try{const d=await api('/api/branches',{headers:authHeaders('pageOpen')});state.branches=d.branches||[];state.branchUsers=d.users||[]}catch(e){toast(e.message)}}
async function saveBranchCredentials(button,id,branchId){const row=button.closest('tr');const username=(row?.querySelector('[data-field="username"]')?.value||'').trim();const password=row?.querySelector('[data-field="password"]')?.value||'';if(!username)return toast('Please enter the Branch Login ID.');if(password.length<4)return toast('Password must be at least 4 characters.');try{const cell=button?.closest('tr');const branchName=(cell?.querySelector('[data-branch-name]')?.dataset.branchName||'').trim();const branchCodeValue=(cell?.querySelector('[data-branch-code]')?.dataset.branchCode||'').trim();
if(id){await api('/api/branches',{method:'PUT',headers:authHeaders('pageOpen'),body:JSON.stringify({id:String(id),username,password,name:branchName,code:branchCodeValue,branchId:branchId||undefined})});}
else{await api('/api/branches',{method:'PUT',headers:authHeaders('pageOpen'),body:JSON.stringify({username,password,name:branchName,code:branchCodeValue,branchId:branchId||undefined})});}await refreshBranchCredentials();renderBranches();toast('Branch Login ID & Password updated.')}catch(e){toast(e.message)}}
function go(p){state.page=p;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));pageTitle.querySelector('h2').textContent=pageMeta[p][0];pageSub.textContent=pageMeta[p][1];sidebar.classList.remove('open');document.getElementById('app').classList.remove('menu-open');renderPage(p)}
function renderAll(){renderPage(state.page)}
function renderPage(p){if(p==='dashboard')renderDashboard();if(p==='students')renderStudents();if(p==='collections')renderCollections();if(p==='branches')renderBranches();if(p==='reports')renderReports()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}
function fee(s){return Number(s.totalFee||0)}function paid(s){return Number(s.paidFee||0)}function pending(s){return Math.max(0,fee(s)-paid(s))}function commission(v){return Number(v||0)*.25}function collectionAmount(h){return Number(h?.amount||h?.velanja||h?.mota||h?.mission||0)}function scopedCollectionTotal(){return scopedHistory().reduce((a,h)=>a+collectionAmount(h),0)}
function branches(){return [...new Set(state.students.map(s=>s.branch).filter(Boolean))].sort()}
function scopedStudents(){if(state.access?.type==='branch')return state.students.filter(s=>String(s.branchId||s.branch)===String(state.access.branchId||state.access.branch)||s.branch===state.access.branch);return state.students}
function scopedHistory(){if(state.access?.type==='branch')return state.history.filter(h=>h.branch===state.access.branch||String(h.branchId)===String(state.access.branchId));return state.history}
function renderDashboard(){const ss=scopedStudents(),hh=scopedHistory(),total=ss.reduce((a,s)=>a+fee(s),0),p=ss.reduce((a,s)=>a+paid(s),0),pend=ss.reduce((a,s)=>a+pending(s),0),earned=commission(p),coll=scopedCollectionTotal(),balance=Math.max(0,earned-coll),over=Math.max(0,coll-earned);dashboard.innerHTML=`
<div class="stats"><div class="stat"><div class="label">TOTAL STUDENTS</div><div class="value">${ss.length}</div><div class="sub">${state.access.type==='main'?'Across all branches':'Your branch'}</div></div>
<div class="stat"><div class="label">TOTAL FEES</div><div class="value">${money(total)}</div><div class="sub">All students</div></div>
<div class="stat"><div class="label">FEES RECEIVED</div><div class="value">${money(p)}</div><div class="sub">Student payments</div></div>
<div class="stat"><div class="label">YOUR 25%</div><div class="value">${money(earned)}</div><div class="sub">25% of received fees</div></div>
<div class="stat"><div class="label">COLLECTION TAKEN</div><div class="value">${money(coll)}</div><div class="sub">Money taken from branches</div></div>
<div class="stat"><div class="label">BALANCE TO COLLECT</div><div class="value">${money(balance)}</div><div class="sub">Your 25% minus collections</div></div></div>
${over?`<div class="hint" style="margin:12px 0">Collection taken is ${money(over)} more than the calculated 25%.</div>`:''}
<div class="grid2"><div class="panel"><div class="panel-head"><div><h3>Branch-wise commission</h3><p>Each branch is shown as a card — no horizontal scrolling.</p></div><button class="btn" onclick="go('branches')">View all</button></div><div class="branch-summary-grid">${branchSummary().length?branchSummary().map(b=>`<div class="branch-summary-card"><div class="branch-summary-head"><div><div class="branch-summary-title">${esc(b.name)}</div><div class="branch-summary-code">${esc(b.code)}</div></div><div class="branch-summary-students">${b.students} students</div></div><div class="branch-summary-main">${money(b.paid)} <small>received</small></div><div class="branch-summary-metrics"><div class="branch-summary-metric"><span>Total Fee</span><b>${money(b.total)}</b></div><div class="branch-summary-metric"><span>Your 25%</span><b>${money(b.earned)}</b></div><div class="branch-summary-metric"><span>Collection Taken</span><b>${money(b.collections)}</b></div><div class="branch-summary-metric"><span>Pending Fee</span><b>${money(b.pending)}</b></div></div><div class="branch-summary-balance"><span>Balance to collect</span><b>${money(b.balance)}</b></div></div>`).join(''):'<div class="branch-summary-empty">No branch data found.</div>'}</div></div>
<div class="panel"><div class="panel-head"><div><h3>Recent students</h3><p>Latest records in the system</p></div><button class="btn" onclick="go('students')">Open</button></div><div class="table-wrap"><table class="table"><tbody>${ss.slice(-6).reverse().map(s=>studentRow(s)).join('')}</tbody></table></div></div></div>`}
function branchSummary(){const names=state.access.type==='branch'?[state.access.branch]:branches();return names.map(name=>{const ss=scopedStudents().filter(s=>s.branch===name),paidv=ss.reduce((a,s)=>a+paid(s),0),total=ss.reduce((a,s)=>a+fee(s),0),earned=commission(paidv),collections=state.history.filter(h=>h.branch===name||String(h.branchId)===String(ss[0]?.branchId||'' )).reduce((a,h)=>a+collectionAmount(h),0),balance=Math.max(0,earned-collections),over=Math.max(0,collections-earned);return {name,code:branchCode(name),students:ss.length,paid:paidv,total,pending:Math.max(0,total-paidv),earned,collections,balance,over}})}
function branchCode(n){return ({'Velanja':'VELANJ','Mota Varachha':'MOTAVA','Mission Road':'MISSION'})[n]||n.slice(0,6).toUpperCase()}
function studentRow(s){return `<tr><td><div class="namecell">${esc(s.name)}</div><div class="muted">${esc(s.id)} • ${esc(s.mobile||'No mobile')}</div></td><td>${esc(s.branch)}</td><td>${money(fee(s))}</td><td>${money(paid(s))}</td><td>${money(pending(s))}</td><td>${money(commission(paid(s)))}</td></tr>`}
function renderStudents(){const ss=scopedStudents(),bs=state.access.type==='main'?branches():[state.access.branch];students.innerHTML=`
<div class="panel"><div class="panel-head"><div><h3>Student directory</h3><p>${ss.length} students loaded • branch-wise management</p></div><div class="toolbar"><input id="studentSearch" placeholder="Search name / ID / mobile" oninput="renderStudentTable()">${state.access.type==='main'?`<select id="studentBranchFilter" onchange="renderStudentTable()"><option value="ALL">All branches</option>${bs.map(b=>`<option>${esc(b)}</option>`).join('')}</select>`:''}<button class="btn green" onclick="exportStudents()">Excel</button>${state.access.type==='main'?`<button class="btn" onclick="openRecycleBin()">♻ Recycle Bin (${state.deletedStudents.length})</button>`:''}${state.access.type==='main'?`<button class="btn primary-btn" onclick="openStudent()">+ Add student</button>`:''}</div></div><div class="branch-tabs"><button class="branch-tab active" data-b="ALL" onclick="setStudentBranch('ALL',this)"><div class="branch-card-title"><span class="branch-card-name">All Branches</span><span>▣</span></div><div class="branch-card-count">${ss.length}</div><div class="branch-card-meta">Total students</div></button>${bs.map(b=>{const cnt=ss.filter(s=>s.branch===b).length;return `<button class="branch-tab" data-b="${esc(b)}" onclick="setStudentBranch('${esc(b)}',this)"><div class="branch-card-title"><span class="branch-card-name">${esc(b)}</span><span>⌂</span></div><div class="branch-card-count">${cnt}</div><div class="branch-card-meta">Students in this branch</div></button>`}).join('')}</div><div id="studentTable"></div></div>`;renderStudentTable()}
function setStudentBranch(b,el){state.studentBranch=b;document.querySelectorAll('.branch-tab').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');renderStudentTable()}
function nextStudentId(){const nums=[...state.students,...state.deletedStudents].map(s=>{const m=String(s.id||'').match(/^(?:S)?(\d+)$/i);return m?Number(m[1]):0;});const n=(nums.length?Math.max(...nums):0)+1;return 'S'+String(n).padStart(3,'0')}
function renderStudentTable(){const q=(document.getElementById('studentSearch')?.value||'').toLowerCase(),filter=document.getElementById('studentBranchFilter')?.value||state.studentBranch||'ALL';let ss=scopedStudents().filter(s=>(filter==='ALL'||s.branch===filter)&&[s.id,s.name,s.mobile,s.branch].join(' ').toLowerCase().includes(q));studentTable.innerHTML=ss.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Branch</th><th>Total fee</th><th>Received</th><th>Pending fee</th><th>Your 25%</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr><td><div class="namecell">${esc(s.name)}</div><div class="muted">${esc(s.id)} • ${esc(s.mobile||'No mobile')}</div></td><td><span class="badge blue">${esc(s.branch)}</span></td><td>${money(fee(s))}</td><td>${money(paid(s))}</td><td>${money(pending(s))}</td><td>${money(commission(paid(s)))}</td><td>${state.access.type==='main'?`<button class="btn" onclick="openStudentById(this.dataset.id)" data-id="${esc(s.id)}">Edit</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No students found.</div>'}
function openStudentById(id){openStudent(id)}
async function deleteStudentById(id){await deleteStudent(id)}
function openCollectionByIndex(index){const h=state.history[Number(index)]; if(h) openCollection(String(h._id||''),h)}
async function deleteCollectionById(id){await deleteCollection(id)}
async function openStudent(id=''){
  if(state.access.type==='branch'){const pass=await requestAdminEdit(id?'studentEdit':'studentAdd');if(!pass)return;}
  const s=state.students.find(x=>x.id===id)||{id:nextStudentId(),name:'',mobile:'',branch:state.access.type==='branch'?state.access.branch:(branches()[0]||''),totalFee:'',paidFee:'',payments:[]};
  if(id&&state.access.type==='branch'&&s.branch!==state.access.branch)return toast('This student is outside your branch.');
  modalTitle.textContent=id?'Edit student':'Add student';
  const branchList=state.access.type==='branch'?[state.access.branch]:branches();
  modalBody.innerHTML=`<div class="formgrid">
    <div class="field"><label>Student ID</label><input id="f_id" value="${esc(s.id)}" ${id?'readonly':''}></div>
    <div class="field"><label>Student name</label><input id="f_name" value="${esc(s.name)}"></div>
    <div class="field"><label>Mobile</label><input id="f_mobile" value="${esc(s.mobile)}"></div>
    <div class="field"><label>Branch</label><select id="f_branch" ${state.access.type==='branch'?'disabled':''}>${branchList.map(b=>`<option ${b===s.branch?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
    <div class="field"><label>Total fee</label><input id="f_total" type="number" value="${s.totalFee??''}"></div>
    <div class="field"><label>Received fee</label><input id="f_paid" type="number" value="${s.paidFee??''}"></div>
  </div><div class="panel" style="margin-top:14px;padding:14px"><b>Student commission</b><div class="muted" style="margin-top:8px">Received fee: ${money(paid(s))} • Your 25%: <b>${money(commission(paid(s)))}</b></div></div><div class="panel" style="margin-top:14px;padding:14px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b>Fee payment history</b><button class="btn" type="button" onclick="addPaymentRow()">+ Add payment</button></div><div id="paymentRows" style="margin-top:10px">${paymentRowsHtml(s.payments||[])}</div><div class="muted" style="margin-top:8px">Received fee can be entered directly, or calculated from the payment history when entries are added.</div></div>
  <div class="actions">
    ${id?`<button class="btn danger" onclick="deleteStudentById(this.dataset.id)" data-id="${esc(id)}">Delete</button>`:''}
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn primary-btn" onclick="saveStudentById(this.dataset.id)" data-id="${esc(id)}">Save student</button>
  </div>`;
  modal.classList.add('show');
}
function paymentRowsHtml(payments){return payments.length?payments.map((x,i)=>`<div class="payment-row" style="display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;margin-bottom:8px"><input class="pay-date" type="date" value="${esc(x.date)}"><input class="pay-amt" type="number" value="${Number(x.amount||0)}"><input class="pay-note" value="${esc(x.note||'')}" placeholder="Note"><button class="btn danger" type="button" onclick="this.parentElement.remove()">×</button></div>`).join(''):`<div class="muted">No payments added yet.</div>`} 
function addPaymentRow(){const box=document.getElementById('paymentRows');if(!box)return;const empty=box.querySelector('.muted');if(empty)empty.remove();const row=document.createElement('div');row.className='payment-row';row.style='display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;margin-bottom:8px';row.innerHTML=`<input class="pay-date" type="date" value="${new Date().toISOString().slice(0,10)}"><input class="pay-amt" type="number" value=""><input class="pay-note" placeholder="Note"><button class="btn danger" type="button" onclick="this.parentElement.remove()">×</button>`;box.appendChild(row)}
function readPaymentRows(){return [...document.querySelectorAll('#paymentRows .payment-row')].map(r=>({date:r.querySelector('.pay-date')?.value||'',amount:Number(r.querySelector('.pay-amt')?.value||0),note:r.querySelector('.pay-note')?.value||''})).filter(x=>x.date&&x.amount>0)}
async function saveStudent(oldId){if(state.access?.type==='branch')return toast('Branch login is read-only. Only Main Admin can make changes.');const payments=readPaymentRows();const manualPaid=f_paid.value===''?null:Number(f_paid.value);const s={id:f_id.value.trim(),name:f_name.value.trim(),mobile:f_mobile.value.trim(),branch:state.access.type==='branch'?state.access.branch:f_branch.value,totalFee:f_total.value===''?null:Number(f_total.value),paidFee:payments.length?payments.reduce((a,x)=>a+x.amount,0):manualPaid,payments};if(!s.id||!s.name)return toast('Student ID and name are required.');if(!oldId&&state.students.some(x=>x.id===s.id))return toast('Student ID already exists.');let arr=[...state.students];const idx=arr.findIndex(x=>x.id===oldId);if(idx>=0)arr[idx]={...arr[idx],...s};else arr.push(s);await saveData(oldId?'studentEdit':'studentAdd',arr,state.history,currentGrant(oldId?'studentEdit':'studentAdd'));closeModal()}
async function saveStudentById(id){await saveStudent(id)}
async function deleteStudent(id){if(state.access?.type==='branch')return toast('Branch login is read-only. Only Main Admin can make changes.');if(!confirm('Delete this student?'))return;const arr=state.students.filter(s=>s.id!==id);await saveData('studentDelete',arr,state.history,currentGrant('studentDelete'));closeModal()}
function openRecycleBin(){if(state.access.type!=='main')return toast('Recycle Bin is available to Main Admin only.');modalTitle.textContent='Recycle Bin — Deleted Students';const rows=state.deletedStudents.length?state.deletedStudents.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="muted">${esc(s.id)} • ${esc(s.mobile||'No mobile')}</div></td><td>${esc(s.branch||'-')}</td><td>${s.deletedAt?new Date(s.deletedAt).toLocaleString():'-'}</td><td><div class="toolbar"><button class="btn primary-btn" onclick="restoreStudent(this.dataset.id)" data-id="${esc(s.id)}">Restore</button><button class="btn danger" onclick="permanentDeleteStudent(this.dataset.id)" data-id="${esc(s.id)}">Permanent Delete</button></div></td></tr>`).join(''):`<tr><td colspan="4" class="empty">Recycle Bin is empty.</td></tr>`;modalBody.innerHTML=`<div class="hint" style="margin-bottom:12px">Deleted students stay here until you restore them. Their Student ID will be preserved. <b>Permanent Delete cannot be undone.</b></div><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Branch</th><th>Deleted At</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div><div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`;modal.classList.add('show')}
async function permanentDeleteStudent(id){if(state.access.type!=='main')return toast('Only Main Admin can permanently delete.');if(!confirm('Permanently delete this student? This cannot be undone.'))return;try{const d=await api('/api/state',{method:'PUT',headers:authHeaders('studentPermanentDelete'),body:JSON.stringify({deleteId:id})});state.deletedStudents=d.deletedStudents||[];openRecycleBin();toast('Student permanently deleted.')}catch(e){toast(e.message)}}
async function restoreStudent(id){if(state.access.type!=='main')return toast('Only Main Admin can restore.');if(!confirm('Restore this student?'))return;try{const d=await api('/api/state',{method:'PUT',headers:authHeaders('studentRestore'),body:JSON.stringify({restoreId:id,students:state.students,history:state.history,payouts:state.payouts})});state.students=d.students||state.students;state.history=d.history||state.history;state.payouts=d.payouts||state.payouts;state.deletedStudents=(state.deletedStudents||[]).filter(s=>s.id!==id);renderAll();closeModal();toast('Student restored successfully.')}catch(e){toast(e.message)}}
function renderCollections(){const hh=scopedHistory(),total=scopedCollectionTotal(),ss=scopedStudents(),earned=commission(ss.reduce((a,s)=>a+paid(s),0)),balance=Math.max(0,earned-total),over=Math.max(0,total-earned);collections.innerHTML=`<div class="stats"><div class="stat"><div class="label">TOTAL FEE RECEIVED</div><div class="value">${money(ss.reduce((a,s)=>a+paid(s),0))}</div><div class="sub">From student records</div></div><div class="stat"><div class="label">YOUR 25%</div><div class="value">${money(earned)}</div><div class="sub">25% of received fees</div></div><div class="stat"><div class="label">COLLECTION TAKEN</div><div class="value">${money(total)}</div><div class="sub">Money taken from branches</div></div><div class="stat"><div class="label">BALANCE TO COLLECT</div><div class="value">${money(balance)}</div><div class="sub">25% minus collection taken</div></div></div>${over?`<div class="hint" style="margin:12px 0">Collection taken is ${money(over)} more than your calculated 25%.</div>`:''}
<div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Collection history</h3><p>Here “collection” means money you took from the branch — it is NOT multiplied by 25%.</p></div><div class="toolbar"><button class="btn green" onclick="exportCollections()">Excel</button><button class="btn primary-btn" onclick="openCollection()">+ Add collection</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Branch</th><th>Collection Taken</th><th></th></tr></thead><tbody>${hh.slice().reverse().map(h=>{const a=collectionAmount(h);return `<tr><td>${esc(h.date)}</td><td><span class="badge blue">${esc(h.branch||'-')}</span></td><td><b>${money(a)}</b></td><td><button class="btn" onclick="openCollectionByIndex(this.dataset.index)" data-index="${state.history.indexOf(h)}">Edit</button></td></tr>`}).join('')}</tbody></table></div></div>`}

async function saveCollection(id){const h={date:c_date.value,branch:state.access.type==='branch'?state.access.branch:c_branch.value,amount:Number(c_amount.value||0)};if(!h.date||h.amount<=0)return toast('Enter date and amount.');let arr=[...state.history];if(id){const i=arr.findIndex(x=>String(x._id||'')===String(id));if(i>=0)arr[i]={...arr[i],...h}}else arr.push(h);await saveData(id?'collectionEdit':'collectionAdd',state.students,arr,currentGrant(id?'collectionEdit':'collectionAdd'));closeModal()}
async function saveCollectionById(id){await saveCollection(id)}
async function deleteCollection(id){if(state.access.type==='branch'){const pass=await requestAdminEdit('collectionDelete');if(!pass)return;}if(!confirm('Delete this collection entry?'))return;const arr=state.history.filter(x=>String(x._id||'')!==String(id));await saveData('collectionDelete',state.students,arr,currentGrant('collectionDelete'));closeModal()}

function renderBranches(){const rows=branchSummary();const grand=rows.reduce((a,b)=>({total:a.total+b.total,paid:a.paid+b.paid,earned:a.earned+b.earned,collections:a.collections+b.collections,balance:a.balance+b.balance}),{total:0,paid:0,earned:0,collections:0,balance:0});const creds=state.access.type==='main'?(()=>{const base=[{name:'Velanja',code:'VELANJ'},{name:'Mota Varachha',code:'MOTAVA'},{name:'Mission Road',code:'MISSION'}];const list=base.map(x=>state.branches.find(b=>String(b.name).toLowerCase()===x.name.toLowerCase()||String(b.code).toUpperCase()===x.code)||x);return `<div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Branch Login ID & Password</h3><p>Main Admin can see, edit and give each branch its login credentials.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Branch</th><th>Login ID</th><th>Password</th><th>Action</th></tr></thead><tbody>${list.map(b=>{const u=state.branchUsers.find(x=>String(x.branchId?._id||x.branchId)===String(b._id)||String(x.branchId?.code||'').toUpperCase()===String(b.code||'').toUpperCase()||String(x.branchId?.name||'').toLowerCase()===String(b.name||'').toLowerCase());const uid=String(u?.id||b._id||b.code);const username=u?.username||((b.code||'BRANCH').toLowerCase()+'_admin');const password=u?.password||((b.code||'BRANCH')+'@2026');return `<tr><td data-branch-name="${esc(b.name)}" data-branch-code="${esc(b.code)}"><b>${esc(b.name)}</b><div class="muted">${esc(b.code)}</div></td><td><input id="bu_${esc(uid)}" data-field="username" value="${esc(username)}" autocomplete="off" style="min-width:180px"></td><td><input id="bp_${esc(uid)}" data-field="password" type="text" value="${esc(password)}" autocomplete="off" style="min-width:180px"></td><td><button class="btn primary-btn" onclick="saveBranchCredentials(this,'${esc(u?.id||'')}','${esc(b._id||'')}')">Update</button></td></tr>`}).join('')}</tbody></table></div></div>`})():'';document.getElementById('branches').innerHTML=`<div class="panel"><div class="panel-head"><div><h3>Branch-wise financial summary</h3><p>Every branch is displayed as a card, so mobile view never needs a horizontal slider.</p></div></div><div class="branch-summary-grid">${rows.length?rows.map(b=>`<div class="branch-summary-card"><div class="branch-summary-head"><div><div class="branch-summary-title">${esc(b.name)}</div><div class="branch-summary-code">${esc(b.code)}</div></div><div class="branch-summary-students">${b.students} students</div></div><div class="branch-summary-main">${money(b.paid)} <small>received</small></div><div class="branch-summary-metrics"><div class="branch-summary-metric"><span>Total Fee</span><b>${money(b.total)}</b></div><div class="branch-summary-metric"><span>Your 25%</span><b>${money(b.earned)}</b></div><div class="branch-summary-metric"><span>Collection Taken</span><b>${money(b.collections)}</b></div><div class="branch-summary-metric"><span>Pending Fee</span><b>${money(b.pending)}</b></div></div><div class="branch-summary-balance"><span>Balance to collect</span><b>${money(b.balance)}</b></div></div>`).join(''):'<div class="branch-summary-empty">No branch data found.</div>'}</div><div style="padding:0 14px 14px"><div class="branch-summary-card" style="background:#f7f9fc"><div class="branch-summary-head"><div class="branch-summary-title">Grand Total</div><div class="branch-summary-students">${rows.reduce((a,b)=>a+b.students,0)} students</div></div><div class="branch-summary-metrics"><div class="branch-summary-metric"><span>Total Fee</span><b>${money(grand.total)}</b></div><div class="branch-summary-metric"><span>Received Fee</span><b>${money(grand.paid)}</b></div><div class="branch-summary-metric"><span>Your 25%</span><b>${money(grand.earned)}</b></div><div class="branch-summary-metric"><span>Collection Taken</span><b>${money(grand.collections)}</b></div></div><div class="branch-summary-balance"><span>Balance to collect</span><b>${money(grand.balance)}</b></div></div></div></div>${creds}`}

function filterBranch(name){go('students');setTimeout(()=>{state.studentBranch=name;const el=[...document.querySelectorAll('.branch-tab')].find(x=>x.dataset.b===name);if(el)setStudentBranch(name,el)},0)}
function renderReports(){const ss=scopedStudents(),by=branchSummary(),total=ss.reduce((a,s)=>a+fee(s),0),received=ss.reduce((a,s)=>a+paid(s),0),earned=commission(received),collections=scopedCollectionTotal(),balance=Math.max(0,earned-collections);reports.innerHTML=`<div class="grid2"><div class="panel"><div class="panel-head"><div><h3>Grand financial summary</h3><p>Collection is money taken from a branch, so it is deducted directly from your 25% total.</p></div><button class="btn green" onclick="exportStudents()">Export students</button></div><div class="table-wrap"><table class="table"><tbody><tr><td>Total students</td><td><b>${ss.length}</b></td></tr><tr><td>Total fee</td><td><b>${money(total)}</b></td></tr><tr><td>Fee received</td><td><b>${money(received)}</b></td></tr><tr><td>Your 25%</td><td><b>${money(earned)}</b></td></tr><tr><td>Collection taken from branches</td><td><b>${money(collections)}</b></td></tr><tr><td>Balance still to collect</td><td><b>${money(balance)}</b></td></tr></tbody></table></div></div><div class="panel"><div class="panel-head"><div><h3>Branch report</h3><p>Branch-wise + grand total</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Branch</th><th>Total Fee</th><th>Received</th><th>25%</th><th>Collection</th><th>Balance</th></tr></thead><tbody>${by.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${money(b.total)}</td><td>${money(b.paid)}</td><td>${money(b.earned)}</td><td>${money(b.collections)}</td><td><b>${money(b.balance)}</b></td></tr>`).join('')}</tbody></table></div></div></div>`}
function exportStudents(){const rows=scopedStudents().map(s=>({ID:s.id,Name:s.name,Mobile:s.mobile,Branch:s.branch,'Total Fee':fee(s),'Paid Fee':paid(s),'Pending':pending(s),'Commission 25%':commission(paid(s)),}));const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Students');XLSX.writeFile(wb,'SpeakPro_Students.xlsx')}
function exportCollections(){const rows=scopedHistory().map(h=>({Date:h.date,Branch:h.branch,'Collection Taken':collectionAmount(h)}));const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Collections');XLSX.writeFile(wb,'SpeakPro_Collections.xlsx')}
function closeModal(){modal.classList.remove('show')}
function toggleSidebar(){
  const sb=document.getElementById('sidebar'), appEl=document.getElementById('app');
  const open=sb.classList.toggle('open');
  appEl.classList.toggle('menu-open',open);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const sb=document.getElementById('sidebar'), appEl=document.getElementById('app');
    sb.classList.remove('open'); appEl.classList.remove('menu-open'); closeModal();
  }
});
document.getElementById('app').addEventListener('click',e=>{
  if(e.target===e.currentTarget && e.currentTarget.classList.contains('menu-open')) toggleSidebar();
});
</script>
</body></html>
